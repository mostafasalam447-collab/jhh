<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>الأشعة — السونار</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#0f172a;line-height:1.6;padding-bottom:60px}
#err{display:none;background:#fee2e2;color:#991b1b;padding:12px 16px;font-size:14px;direction:ltr}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
.hero{background:linear-gradient(135deg,#0f766e,#0891b2);color:#fff;border-radius:0 0 22px 22px;padding:28px 18px 22px;text-align:center}

.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:112px;max-width:150px;padding:10px 8px 8px;border:0;background:transparent;color:#94a3b8;font-weight:700;font-size:12.5px;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;line-height:1.35}
.tab small{display:block;font-weight:400;font-size:10.5px;opacity:.8;direction:ltr}
.tab.on{color:#fff;border-bottom-color:#22d3ee;background:rgba(255,255,255,.06)}
.bar{padding:6px 12px 8px;color:#fff}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
.bar .pill{background:rgba(255,255,255,.12);padding:3px 10px;border-radius:14px}
.pg{flex:1;min-width:60px;height:6px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:#22d3ee;transition:width .3s}
.swipehint{text-align:center;color:#64748b;font-size:12px;margin:8px 0 2px}
.panel{display:none}
.panel.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:.2;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.on{animation:none}.pg i{transition:none}}
.ptitle{text-align:center;margin:14px 0 0;font-size:18px;color:#0f172a}
.ptitle small{display:block;color:#64748b;font-size:13px;direction:ltr;font-weight:400}
.sec{margin:26px 0 6px;text-align:center;font-weight:700;color:#0f766e;font-size:14px;background:#ccfbf1;border:1px solid #99f6e4;border-radius:12px;padding:8px 12px}
.card{background:#fff;border-radius:16px;padding:18px 16px;margin:12px 0;box-shadow:0 2px 12px rgba(15,23,42,.08);border-right:6px solid #cbd5e1}

.qn{background:#0f766e;color:#fff;min-width:32px;height:32px;border-radius:16px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.tag{background:#ccfbf1;color:#0f766e;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
.qt{font-size:16px;font-weight:700;direction:ltr;text-align:left;margin-bottom:12px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px;direction:ltr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:11px 12px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-size:15px;cursor:pointer;color:#1e293b;font-family:inherit}
.opt b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:13px;background:#f1f5f9;border:2px solid #cbd5e1;font-size:12px;flex-shrink:0}
.opt:focus-visible,.btn:focus-visible,.tab:focus-visible,.inp:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
.opt.right{border-color:#10b981;background:#ecfdf5;color:#065f46;font-weight:700}
.opt.right b{background:#10b981;border-color:#10b981;color:#fff}
.opt.bad{border-color:#ef4444;background:#fef2f2;color:#7f1d1d}
.opt.bad b{background:#ef4444;border-color:#ef4444;color:#fff}
.opt:disabled{cursor:default}
.inp{width:100%;padding:11px 12px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;margin-bottom:8px;direction:ltr;font-family:inherit}
.inp.ok{border-color:#10b981;background:#ecfdf5}.inp.no{border-color:#ef4444;background:#fef2f2}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{padding:10px 18px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn.gh{background:#e2e8f0;color:#334155}
.btn:disabled{opacity:.5;cursor:default}
.solbox{display:none;margin-top:12px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:10px;direction:ltr;font-size:14px;text-align:left;white-space:pre-line}
.solbox .ans{font-weight:700;color:#0f766e}
.solbox .ex{margin-top:6px;color:#334155}
.result{display:none;background:#fff;border-radius:18px;padding:22px 16px;margin:20px 0;text-align:center;box-shadow:0 4px 20px rgba(15,23,42,.12)}
.big{font-size:44px;font-weight:900;color:#0f766e}
.stats{display:flex;gap:10px;justify-content:center;margin:14px 0}
.stat{flex:1;border-radius:12px;padding:10px;font-weight:700}
.stat.c{background:#ecfdf5;color:#059669}.stat.w{background:#fef2f2;color:#dc2626}.stat.p{background:#fffbeb;color:#b45309}
.rev{text-align:right;margin-top:14px}
.ri{background:#fef2f2;border-right:4px solid #ef4444;border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
.ri .q{font-weight:700;direction:ltr;text-align:left}
.ri .a{direction:ltr;text-align:left;color:#065f46;margin-top:4px}
.sbtn{display:block;margin:20px auto 0;padding:14px 50px;font-size:16px}
</style>
</head>

<script>

var Q=[];

function P(tab,secTitle,tag,list){list.forEach(function(it){Q.push({t:tab,st:secTitle,tag:tag,type:'num',q:it[0],v:it[1],unit:it[2],sol:it[3]});});}

/* ---------- Ultrasound ---------- */
M('us1','Ultrasound — 50 MCQs','MCQ',[["Ultrasound is defined as sound with a frequency greater than:", ["20 Hz", "2,000 Hz", "20,000 Hz", "200,000 Hz"], 2], ["Which frequency range is typical for diagnostic ultrasound?", ["20 to 20,000 Hz", "1 to 20 MHz", "50 to 100 MHz", "20 to 200 kHz"], 1], ["The speed of ultrasound in soft tissue at 37°C is about:", ["330 m/s", "960 m/s", "1,200 m/s", "1,540 m/s"], 3], ["SONAR stands for:", ["Sound navigation and ranging", "Sound navigation and radiation", "Sonic non-acoustic ranging", "Sound node analysis and reflection"], 0], ["Why is ultrasound the preferred modality in obstetrics?", ["It penetrates bone better than other modalities", "It does not use ionizing radiation", "It needs no transducer", "It produces only still images"], 1], ["The piezoelectric crystals in a transducer:", ["Dampen the vibrations of the probe", "Store patient images", "Convert electrical energy into sound waves and echoes back into electrical energy", "Protect the internal components of the probe"], 2], ["The function of the matching layer is to:", ["Improve the transmission of sound into the body", "Dampen crystal vibrations", "Amplify returning echoes", "Convert analog signals to digital"], 0], ["The backing material of the transducer:", ["Focuses the beam on deep organs", "Stores the images", "Generates the ultrasound pulse", "Dampens the vibrations of the piezoelectric crystals"], 3], ["The pulser:", ["Amplifies and processes returning echoes", "Sends electrical pulses to the transducer to create sound waves", "Converts the processed signals into a visual image", "Stores images and patient data"], 1], ["The processor (scan converter) is responsible for:", ["Storing patient data", "Amplifying returning echoes", "Converting analog signals to digital signals", "Generating the sound pulse"], 2], ["B-mode (grayscale) imaging displays:", ["The brightness of returning echoes to show anatomical structures", "The speed and direction of blood flow", "Only ices is:", ["Under-gaining the image", "Over-gaining the image", "Setting the depth too shallow", "Using too low a frequency"], 1], ["A structure that is less echogenic than the surrounding tissue is described as:", ["Hyperechoic", "Anechoic", "Hypoechoic", "Devoid of echoes"], 2], ["Posterior acoustic enhancement occurs when sound passes through:", ["Low-attenuating tissue, which enhances echoes behind it", "High-attenuating tissue, which diminishes echoes behind it", "Gas, which scatters the beam", "A boundary between tissues of equal propagation speed"], 0], ["Which artifact appears as recurrent bright arcs at equidistant intervals from the transducer?", ["Refraction", "Gas scatter", "Acoustic shadowing", "Reverberation"], 3], ["Which structures are examined through the intercostal approach in the lecture?", ["Left lobe of the liver and pancreas", "Gallbladder and portal vein", "Urinary bladder and prostate", "Appendix and colon"], 1], ["The right flank window is used to scan the:", ["Spleen", "Pancreas", "Right kidney", "Appendix"], 2], ["The left upper quadrant window is used to scan the:", ["Spleen", "Urinary bladder", "Appendix", "Gallbladder"], 0], ["The right iliac fossa window is used to look for the:", ["Right kidney", "Aorta", "Spleen", "Appendix"], 3], ["The retroperitoneal view is used to visualize:", ["The urinary bladder and ovaries", "The IVC and aorta", "The gallbladder", "The left kidney only"], 1], ["In the female pelvic window, which structures are scanned?", ["Pancreas and spleen", "Right kidney and liver", "Urinary bladder, uterus and ovaries", "Appendix and small bowel"], 2], ["In the peritoneal cavity view, what is the typical finding highlighted?", ["Ascites (free fluid)", "Haustration", "A normal appendix", "The hepatic vein"], 0], ["Haustration is a feature of the:", ["Small bowel", "Gallbladder", "Pancreas", "Normal colon"], 3], ["The subcostal sweep is used to demonstrate the:", ["Right kidney only", "Right lobe of the liver, the gallbladder (short axis) and the portal vein", "Urinary bladder", "Appendix"], 1], ["The longitudinal plane corresponds to the:", ["Transverse plane", "Coronal plane only", "Long axis of the body", "Short axis of the gallbladder"], 2], ["Which is NOT listed as a clinical application of small parts ultrasound?", ["Scrotum", "Salivary glands", "Breast", "Liver"], 3], ["On ultrasound, the normal thyroid appears:", ["Fine and homogeneous, more echogenic than the adjacent muscles", "Anechoic, with posterior enhancement", "Hypoechoic compared with the adjacent muscles", "Heterogeneous, with multiple calcifications"], 0], ["The average size of each thyroid lobe is:", ["Length 1–2 cm, AP 4–5 cm", "Length 4–5 cm, AP 1.5–2.5 cm", "Length 8–10 cm, AP 5 cm", "Length 2 cm, AP 2 cm"], 1], ["Which is a risk factor for malignant transformation of a thyroid nodule?", ["Old age", "Female gender", "Prior radiation exposure", "A soft, mobile nodule"], 2], ["Which ultrasound feature suggests malignancy?", ["Anechoic echogenicity", "Peripheral vascularity", "Presence of a halo sign", "Hypoechogenicity"], 3], ["The halo sign (a hypoechoic or anechoic rim around the nodule) suggests:", ["Benignity when present, and malignancy when absent", "Malignancy when present", "A cyst, whether present or absent", "Thyroiditis"], 0], ["Which calcification pattern suggests malignancy?", ["Peripheral \"egg-shell\" calcification", "Punctate echogenic foci without acoustic shadowing", "Large coarse calcification with shadowing", "No calcification"], 1], ["Regarding nodule composition:", ["Completely solid suggests benignity", "Composition is not useful", "Not completely solid (cystic or septated) suggests benignity, and completely solid suggests malignancy", "Cystic composition suggests malignancy"], 2], ["Which vascularity pattern suggests a malignant nodule?", ["Peripheral vascularity", "Absent flow only", "Reduced flow in the surrounding gland", "Intranodal vascularity"], 3], ["In the Doppler classification of nodular lesions, Type II means:", ["Peri-nodular blood flow", "Absence of blood flow", "Mild intra-nodular blood flow", "Marked intra-nodular blood flow"], 0], ["In the TI-RADS system shown, a total of 7 points or more corresponds to:", ["TR1 (benign)", "TR5 (highly suspicious)", "TR2 (not suspicious)", "TR3 (mildly suspicious)"], 1], ["Regarding goitre:", ["It always causes hyperthyroidism", "It means shrinkage of the gland", "Euthyroid goitre is the most common type, and iodine deficiency is usually the cause", "It never occurs in physiologic states such as pregnancy"], 2], ["Adenomatous (colloid) nodules are:", ["True malignant neoplasms", "Rare solid tumors", "Hot nodules with no cystic change", "The most common type of thyroid nodule, representing zones of hyperplasia with cystic components"], 3], ["How can a small solid adenoma be distinguished from a cyst?", ["A solid lesion will not show posterior acoustic enhancement", "A solid lesion always shows posterior acoustic enhancement", "A solid lesion is always anechoic", "They cannot be distinguished by ultrasound"], 0], ["A thyroid cyst on ultrasound is typically:", ["Hyperechoic with posterior shadowing", "Round or oval, anechoic, with increased through-transmission and edge shadowing", "Irregular and solid", "Hypoechoic with intranodal flow"], 1], ["Thyroiditis on ultrasound typically shows:", ["A small gland with increased echogenicity", "A solitary well-defined hyperechoic mass", "A diffusely enlarged gland with decreased echogenicity and a heterogeneous pattern", "A purely anechoic gland"], 2]]);
T('us2','Ultrasound — 50 True / False','T/F',[["Ultrasound is sound with a frequency above 20,000 Hz.", true, ""], ["Diagnostic ultrasound typically uses frequencies of about 1⁠–⁠20 MHz.", true, ""], ["Ultrasound waves can travel through a vacuum if the frequency is high enough.", false, "Sound cannot travel through a vacuum at any frequency."], ["The speed of ultrasound in soft tissue is about 1540 m/s.", true, ""], ["Sonography uses ionizing radiation, so it is avoided in obstetrics.", false, "Sonography uses no ionizing radiation, which is why it is preferred in obstetrics."], ["The transducer only receives echoes. A separate device generates the sound waves.", false, "The transducer both generates and receives ultrasound waves."], ["Piezoelectric crystals convert electrical energy into sound waves, and returning echoes back into electrical energy.", true, ""], ["The backing material improves the transmission of sound into the body.", false, "The matching layer improves transmission. The backing material dampens the crystal vibrations."], ["The processor (scan converter) converts analog signals to digital signals.", true, ""], ["The pulser amplifies and processes the returning echoes.", false, "The receiver amplifies and processes echoes. The pulser sends electrical pulses to the transducer."], ["B-mode displays the brightness of returning echoes, and most routine imaging is done in B-mode.", true, ""], ["Doppler imaging measures the change in frequency of sound waves reflecting off moving red blood cells.", true, ""], ["High-frequency transducers (10⁠–⁠15 MHz) are ideal for superficial structures.", true, ""], ["Low-frequency transducers (2⁠–⁠5 MHz) give excellent detail but have limited depth.", false, "Low-frequency probes penetrate deeply but give less detail."], ["The higher the frequency, the less the ultrasound beam penetrates.", true, ""], ["The lower the frequency, the better the image resolution.", false, "Higher frequency gives better resolution."], ["A convex (curvilinear) array of 2⁠–⁠5 MHz is known as the “abdominal probe.”", true, ""], ["The phased array “cardiac probe” operates at 4⁠–⁠13 MHz.", false, "The cardiac probe is 1.7⁠–⁠4 MHz. The 4⁠–⁠13 MHz probe is the linear (vascular) one."], ["A small patient calls for a high-frequency probe, and a large patient for a low-frequency probe.", true, ""], ["In a sagittal scan, the probe indicator points toward the patient’s head.", true, ""], ["In a transverse scan, the probe indicator points toward the patient’s left.", false, "In a transverse scan, the indicator points toward the patient’s right."], ["A hyperechoic structure is less echogenic than the surrounding tissue.", false, "Hyperechoic means more echogenic than the surrounding tissue."], ["Novices tend to under-gain the image.", false, "Novices tend to over-gain the image."], ["Time gain compensation (TGC) amplifies the returning signal for better imaging at depth.", true, ""], ["High-attenuating tissue causes posterior acoustic enhancement.", false, "High attenuation causes an acoustic shadow. Low attenuation causes posterior enhancement."], ["Low-attenuating tissue (such as fluid) enhances echoes posteriorly and can act as a “window.”", true, ""], ["Reverberation appears as recurrent bright arcs at equidistant intervals from the transducer.", true, ""], ["Refraction occurs when sound crosses a boundary between tissues with the same propagation speed.", false, "Refraction occurs at a boundary between tissues with different propagation speeds."], ["The basic parts of an ultrasound machine include the display, transducer, keyboard, CPU, disk storage, and printer.", true, ""], ["Abdominal ultrasound is limited to the liver and gallbladder. The kidneys cannot be assessed.", false, "It covers many organs, including the kidneys, spleen, pancreas, bladder, and uterus."], ["The left lobe of the liver is scanned from the epigastric region in both transverse and longitudinal planes.", true, ""], ["A subcostal sweep can show the gallbladder in long and short axis, as well as the porta vein.", true, ""], ["The right kidney is imaged from the right flank, with the liver as an acoustic window.", true, ""], ["Haustration is a feature of the normal colon.", true, ""], ["The appendix is evaluated from the left iliac fossa.", false, "The appendix is evaluated from the right iliac fossa."], ["The IVC and aorta are assessed with the probe placed over the pelvis.", false, "They are assessed in the retroperitoneum, from the epigastric/midline abdomen."], ["The two basic scanning planes in abdominal ultrasound are transverse and longitudinal.", true, ""], ["Ascites appears as free fluid in the peritoneal cavity.", true, ""], ["Small parts ultrasound uses high-frequency probes to evaluate superficial structures.", true, ""], ["The normal thyroid is less echogenic than the adjacent muscles.", false, "The normal thyroid is more echogenic than the adjacent muscles."], ["The thyroid isthmus lies in the superior half of the gland and connects the two lobes.", false, "The isthmus lies in the inferior half of the gland."], ["No single ultrasound characteristic is diagnostic of a benign or malignant thyroid nodule.", true, ""], ["Peripheral “egg-shell” calcifications suggest malignancy.", false, "Peripheral calcifications suggest benign. Punctate ones suggest malignancy."], ["The presence of a halo sign suggests a benign nodule.", true, ""], ["Intranodal vascularity suggests malignancy, while peripheral vascularity suggests a benign nodule.", true, ""], ["A Type II Doppler pattern means marked intranodular blood flow.", false, "Type II is peri-nodular flow. Type IV is marked intranodular flow."], ["Adenomatous (colloid) nodules are true neoplasms.", false, "They are not true neoplasms. They are zones of hyperplasia."], ["A thyroid cyst is typically anechoic with increased through-transmission.", true, ""], ["Young age and male gender are risk factors for malignant transformation of a thyroid nodule.", true, ""], ["Euthyroid goiter is the most common type of goiter, and iodine deficiency is usually the cause.", true, ""]]);

/* ---------- engine ---------- */
var st={},cur=0,TQ={};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tabIdx(k){for(var i=0;i<TABS.length;i++)if(TABS[i].k===k)return i;return 0;}
Q.forEach(function(q,i){q.id=i;q.ti=tabIdx(q.t);(TQ[q.ti]=TQ[q.ti]||[]).push(i);});

function correctText(q){return q.type==='num'?(q.v+' '+q.unit):(L[q.c]+') '+q.o[q.c]);}

function cardHtml(q,n){
 var h='<div class="card" id="c'+q.id+'"><div class="qh"><span class="qn">'+n+'</span><span class="tag">'+esc(q.tag)+'</span></div>';
 h+='<div class="qt">'+esc(q.q)+'</div>';
 if(q.type==='mcq'){
  h+='<div class="opts">';
  q.o.forEach(function(o,i){h+='<button class="opt" type="button" id="o'+q.id+'_'+i+'" onclick="pick('+q.id+','+i+')"><b>'+L[i]+'</b><span>'+esc(o)+'</span></button>';});
  h+='</div>';
 }else{
  h+='<input class="inp" id="i'+q.id+'" type="text" inputmode="decimal" placeholder="اكتب الناتج (رقم) — '+esc(q.unit)+'">';
  h+='<div class="btns"><button class="btn" type="button" id="k'+q.id+'" onclick="checkNum('+q.id+')">تحقق ✔</button><button class="btn gh" type="button" id="s'+q.id+'" onclick="showSol('+q.id+')">اعرض الحل</button></div>';
 }
 h+='<div class="solbox" id="b'+q.id+'"></div></div>';
 return h;
}
function panelHtml(ti){
 var t=TABS[ti],h='<div class="ptitle">'+esc(t.label)+'<small>'+esc(t.sub)+'</small></div>',last='',n=0;
 TQ[ti].forEach(function(id){
  var q=Q[id];
  if(q.st!==last){h+='<div class="sec">'+esc(q.st)+'</div>';last=q.st;}
  n++;h+=cardHtml(q,n);
 });
 h+='<div class="result" id="r'+ti+'"></div>';
 h+='<button class="btn sbtn" type="button" onclick="finish('+ti+')">إنهاء وعرض النتيجة 🏁</button>';
 return h;
}
function showBox(q,ok){
 var b=document.getElementById('b'+q.id);
 var h='<div class="ans">'+(ok?'✅ إجابة صحيحة':'❌ الإجابة الصحيحة: ')+(ok?'':esc(correctText(q)))+'</div>';
 if(q.type==='num'){h+='<div class="ex">'+esc(q.sol)+'</div>';}
 else if(q.e){h+='<div class="ex">'+esc(q.e)+'</div>';}
 if(!ok||q.type==='num'||q.e){b.innerHTML=h;b.style.display='block';}
 var c=document.getElementById('c'+q.id);c.className='card '+(ok?'ok':'no');
}
function pick(id,i){
 if(st[id])return;var q=Q[id],ok=(i===q.c);
 st[id]={ok:ok};
 q.o.forEach(function(_,j){var b=document.getElementById('o'+id+'_'+j);b.disabled=true;if(j===q.c)b.classList.add('right');else if(j===i)b.classList.add('bad');});
 showBox(q,ok);upd();
}
function checkNum(id){
 if(st[id])return;var q=Q[id],inp=document.getElementById('i'+id);
 var x=parseFloat(String(inp.value).replace(',','.'));
 if(isNaN(x)){inp.focus();return;}
 var ok=Math.abs(x-q.v)<=Math.abs(q.v)*0.01+1e-9;
 st[id]={ok:ok};inp.disabled=true;inp.classList.add(ok?'ok':'no');
 document.getElementById('k'+id).disabled=true;document.getElementById('s'+id).disabled=true;
 showBox(q,ok);
 if(ok){var b=document.getElementById('b'+id);b.innerHTML='<div class="ans">✅ إجابة صحيحة — '+esc(correctText(q))+'</div><div class="ex">'+esc(q.sol)+'</div>';b.style.display='block';}
 upd();
}
function showSol(id){
 if(st[id])return;var q=Q[id];
 st[id]={ok:false,skipped:true};
 document.getElementById('i'+id).disabled=true;
 document.getElementById('k'+id).disabled=true;document.getElementById('s'+id).disabled=true;
 showBox(q,false);upd();
}
function upd(){
 var ids=TQ[cur],tot=ids.length,c=0,w=0;
 ids.forEach(function(id){if(st[id]){if(st[id].ok)c++;else w++;}});
 var d=c+w;
 document.getElementById('sNum').textContent=d+'/'+tot;
 document.getElementById('sC').textContent='✅ '+c;
 document.getElementById('sW').textContent='❌ '+w;
 document.getElementById('sP').textContent='📊 '+(d?Math.round(c/d*100):0)+'%';
 document.getElementById('sFill').style.width=(tot?d/tot*100:0)+'%';
}
function finish(ti){
 var ids=TQ[ti],c=0,w=0,p=0,rev='';
 ids.forEach(function(id){
  var q=Q[id];
  if(!st[id]){p++;}
  else if(st[id].ok){c++;}
  else{w++;rev+='<div class="ri"><div class="q">'+esc(q.q)+'</div><div class="a">✔ '+esc(correctText(q))+'</div></div>';}
 });
 var pct=Math.round(c/ids.length*100);
 var msg=pct>=85?'ممتاز 🔥':pct>=65?'كويس، كمّل 👌':'محتاج مراجعة 📚';
 var h='<h2>'+msg+'</h2><div class="big">'+pct+'%</div><div class="stats"><div class="stat c">✅ '+c+'<br>صح</div><div class="stat w">❌ '+w+'<br>غلط</div><div class="stat p">⏳ '+p+'<br>متجاوب مش</div></div>';
 if(rev)h+='<div class="rev"><b>الأسئلة اللي غلطت فيها:</b><br><br>'+rev+'</div>';
 h+='<button class="btn gh sbtn" type="button" onclick="resetTab('+ti+')">إعادة المحاولة 🔄</button>';
 var r=document.getElementById('r'+ti);r.innerHTML=h;r.style.display='block';
 r.scrollIntoView({behavior:'smooth',block:'start'});
}
function resetTab(ti){
 TQ[ti].forEach(function(id){delete st[id];});
 document.getElementById('p'+ti).innerHTML=panelHtml(ti);
 window.scrollTo(0,0);upd();
}
function show(ti){
 cur=ti;
 TABS.forEach(function(_,i){
  document.getElementById('t'+i).classList.toggle('on',i===ti);
  document.getElementById('p'+i).classList.toggle('on',i===ti);
 });
 var tb=document.getElementById('t'+ti);
 if(tb.scrollIntoView)tb.scrollIntoView({inline:'center',block:'nearest'});
 window.scrollTo(0,0);upd();
}
(function init(){
 var tabs=document.getElementById('tabs'),panels=document.getElementById('panels'),th='',ph='';
 TABS.forEach(function(t,i){
  th+='<button class="tab" type="button" id="t'+i+'" onclick="show('+i+')">'+esc(t.label)+'<small>'+esc(t.sub)+'</small></button>';
  ph+='<div class="panel" id="p'+i+'">'+panelHtml(i)+'</div>';
 });
 tabs.innerHTML=th;panels.innerHTML=ph;
 var x0=0,y0=0;
 document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
 document.addEventListener('touchend',function(e){
  var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
  if(Math.abs(dx)>90&&Math.abs(dy)<50){
   if(e.target&&e.target.closest&&e.target.closest('.tabs,input'))return;
   if(dx<0&&cur<TABS.length-1)show(cur+1);
   else if(dx>0&&cur>0)show(cur-1);
  }
 },{passive:true});
 show(0);
})();
</script>
</body>
</html>
